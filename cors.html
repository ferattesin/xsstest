<!DOCTYPE html>
<html>
  <head>
    <title>NBA CORS Test</title>
  </head>
  <body>
    <h1>NBA Validate Test</h1>
    <script>
      fetch("https://id.nba.com/api/validate/user", {
        method: "GET",
        credentials: "include"
      })
      .then(res => res.text())
      .then(data => {
        console.log("✅ Response Received:");
        console.log(data);
        document.body.innerHTML += "<pre>" + data + "</pre>";
      })
      .catch(err => {
        console.error("❌ Fetch error:", err);
        document.body.innerHTML += "<p style='color:red'>Fetch error: " + err + "</p>";
      });
    </script>
  </body>
</html>
